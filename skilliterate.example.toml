# Copy to skilliterate.toml (or run `skilliterate setup`). Never put the OpenRouter key here, only the variable name.
db = "data/skilliterate.db"

[openrouter]
key_env = "OPEN_ROUTER_TOKEN"
model = "typesafe/jev-router"

[review]
bot = "coderabbitai"

[[skill]]
name = "my-skill"
repo = "owner/repo"
path = "skills/my-skill/SKILL.md"
base = "main"
usage_repos = ["owner/repo"]
# extra_files = ["plugins/x/skills/my-skill/SKILL.md"]   # must stay identical to the skill file
# version_files = ["plugins/x/plugin.json"]               # "version" bumped with the skill
